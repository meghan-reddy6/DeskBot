version: '3.8'

services:
  deskbot-daemon:
    build: .
    container_name: deskbot_runtime
    restart: unless-stopped
    network_mode: "host"
    environment:
      # RUN_MODE: 
      # - GUI: Default for local testing with X11 forwarding available
      # - HEADLESS: Recommended for production/embedded targets
      - RUN_MODE=GUI
      
      # CAMERA_TYPE: 
      # - WEBCAM: Standard V4L2 device stream (/dev/videoX)
      # - GSTREAMER: Hardware-accelerated pipeline stream
      - CAMERA_TYPE=WEBCAM
      
      # INFERENCE_BACKEND: 
      # - PYTORCH: Rapid prototyping and CPU dev testing
      # - ONNX: High-speed production execution on embedded NPU/GPU
      - INFERENCE_BACKEND=PYTORCH
      
    # Hardware Passthrough Mappings
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/snd:/dev/snd"
      
    volumes:
      - deskbot_sqlite_volume:/app/data
      
volumes:
  deskbot_sqlite_volume:
